[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "walksim-mobility"
version = "1.0.0"
description = "Lightweight pedestrian mobility simulation and analysis tool powered by Eclipse SUMO"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Héctor Alonso Benítez García" },
]
keywords = ["pedestrian", "mobility", "microsimulation", "sumo", "transportation"]
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
walksim = "walksim.app:main"

[project.urls]
Homepage = "https://github.com/VanLinux/walksim-mobility"
Repository = "https://github.com/VanLinux/walksim-mobility"
Issues = "https://github.com/VanLinux/walksim-mobility/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/walksim"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
